# Run the orchestrator pytest suite and the frontend Playwright suite on
# every PR and push to main. Without this, the test investment doesn't
# compound — regressions sneak in.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  orchestrator-pytest:
    name: orchestrator pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The export suite runs `node --check` on the patched viz module — the only
      # guard against an export that returns 200 and renders a blank page. Without
      # this the test SKIPS silently if the runner image ever drops node.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install uv

      - name: Install orrery-relay + orchestrator
        run: |
          uv pip install --system -e packages/orrery-relay
          uv pip install --system -e orchestrator

      - name: Install test deps
        run: uv pip install --system pytest httpx pytest-asyncio

      - name: Run pytest
        working-directory: orchestrator
        env:
          # Pipeline tests mock the LLM; these placeholders are just
          # needed to satisfy Settings validation.
          AWS_ACCESS_KEY: ci-test-key
          AWS_SECRET_KEY: ci-test-secret
          AWS_REGION: us-east-1
        # Pre-existing failures (image_path schema mismatch, two stale image_simmer
        # route tests) are tracked separately — deselect them to keep the gate green
        # while the underlying issues are fixed in their own PRs.
        run: |
          python -m pytest tests/ -v \
            --deselect tests/test_db.py::test_document_image_columns \
            --deselect tests/test_image_routes.py::test_image_simmer_trigger \
            --deselect tests/test_image_routes.py::test_image_simmer_conflict

  desktop:
    name: desktop (signing scripts + supervisor)
    runs-on: macos-latest
    timeout-minutes: 30
    # This job only reads the repo; don't hand its shell steps a writable
    # token or leave checkout credentials in the git config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Real-codesign fixtures plus the release-workflow structure checks —
      # otherwise signing regressions (like #52) only surface at release time.
      - name: Signing script tests
        run: bash tauri/scripts/test-sign-macos-resources.sh

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Supervisor tests
        working-directory: tauri/src-tauri
        run: cargo test

  frontend-e2e:
    name: frontend e2e (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Vendor simmer-sdk into worker/ (required by Dockerfile)
        run: |
          git clone --depth 1 https://github.com/2389-research/simmer-sdk.git
          cp -r simmer-sdk worker/simmer-sdk

      - name: Set up .env (dummy creds — LLM-dependent tests are skipped)
        run: |
          cat > .env <<'EOF'
          ANTHROPIC_BACKEND=gateway
          GATEWAY_URL=http://127.0.0.1:65535
          GATEWAY_API_KEY=ci-dummy
          CLASSIFICATION_MODEL=claude-sonnet-4-6
          EXTRACTION_MODEL=claude-haiku-4-5
          AWS_ACCESS_KEY=ci-test-key
          AWS_SECRET_KEY=ci-test-secret
          AWS_REGION=us-east-1
          EOF

      - name: Build and start stack
        run: |
          docker compose up -d --build
          # Wait for orchestrator + frontend to be ready (orchestrator
          # pre-loads sentence-transformers which adds ~10s on boot).
          until curl -sf http://localhost:8100/health; do sleep 2; done
          until curl -sf http://localhost:3100/ > /dev/null; do sleep 2; done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          # The upload-via-UI smoke needs a real LLM backend; skip it in CI
          # where we only have dummy creds.
          SKIP_LLM_TESTS: "1"
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
