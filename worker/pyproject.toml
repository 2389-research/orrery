[project]
name = "orrery-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=0.40.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    # Candidate search in normalizer.py. NOT optional: without it the first
    # normalization pass after an extraction raises ImportError, and the import is
    # deliberately lazy (inside the function) so a missing wheel would not surface
    # until then. The orchestrator already depends on faiss for search; the worker
    # needs its own declaration because neither package imports the other.
    "faiss-cpu>=1.7.0",
    # Cap mirrors orchestrator/pyproject.toml and worker-cloud/requirements.txt:
    # numpy 2.1+ requires the x86_v2 CPU baseline (SSE4.2/POPCNT), which the docker
    # host (and old Intel Macs running the Tauri desktop worker sidecar) may lack →
    # SIGILL on import. Keep all three numpy consumers on the same bound.
    "numpy>=1.26.0,<2.1",
    "pyyaml>=6.0",
    "pypdfium2>=4.30.0",
    "Pillow>=10.0.0",
    # Required by transformers' SigLIP AutoProcessor/SiglipTokenizer. Without them the
    # processor load raises ImportError and page image embeddings are never written
    # (embed_image silently returns None). Same gap class as Pillow. protobuf is
    # needed to convert the SentencePiece tokenizer at load time.
    "sentencepiece>=0.2.0",
    "protobuf>=4.0.0",
    # simmer-sdk: install from PyPI or local path (see worker/Dockerfile)
    # "simmer-sdk>=0.2.0",
    "orrery-relay",
    "orrery-codesum",
    "orrery-tracksum",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
orrery-relay = { path = "../packages/orrery-relay" }
orrery-codesum = { path = "../packages/orrery-codesum" }
orrery-tracksum = { path = "../packages/orrery-tracksum" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
