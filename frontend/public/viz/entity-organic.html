<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orrery — Star</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #01040a; color: #c0c8e0; font-family: 'Courier New', monospace; overflow: hidden; }
canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; cursor: grab; z-index: 1; }
canvas:active { cursor: grabbing; }
#nav {
  position: fixed; top: 12px; left: 14px; z-index: 10;
  display: flex; align-items: center; gap: 8px;
  font: 10px 'Courier New', monospace;
}
#nav .nav-btn {
  padding: 0; background: none; border: none; cursor: pointer;
  color: rgba(100,200,180,0.6); font: 10px 'Courier New', monospace;
  letter-spacing: .06em; transition: color .12s;
}
#nav .nav-btn:hover { color: rgba(100,220,180,1); }
#nav .sep { color: rgba(100,200,180,0.25); font-size: 10px; }
#nav .current { color: rgba(100,200,180,0.9); font-size: 10px; letter-spacing: .06em; }
#hud {
  position: fixed; top: 36px; left: 14px; z-index: 10;
  font-size: 10px; letter-spacing: .08em; line-height: 1.8; pointer-events: none;
}
#hud .info { color: rgba(80,180,160,0.6); }
#hud .sub { color: rgba(80,180,160,0.35); }
#tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: rgba(6,13,34,0.95); border: 0.5px solid rgba(100,200,180,0.25);
  border-radius: 4px; padding: 8px 12px; min-width: 200px; max-width: 350px;
  font: 10px 'Courier New', monospace; color: rgba(210,230,220,0.8); line-height: 1.9;
}
#tooltip .tt-title { font-size: 11px; color: rgba(100,220,180,0.95); margin-bottom: 4px; letter-spacing: .06em; }
#tooltip .tt-dim { color: rgba(100,200,180,0.4); font-size: 9px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nav">
  <button class="nav-btn" onclick="window.parent.postMessage({type:'reset_home'},'*')" title="Reset to galaxy overview">⌂</button>
  <span class="sep">›</span>
  <button class="nav-btn" onclick="window.parent.postMessage({type:'navigate_galaxy'},'*')">Galaxy</button>
  <span class="sep">›</span>
  <span class="current" id="nav-name">...</span>
</div>
<div id="hud">
  <div class="info" id="hud-info"></div>
  <div class="sub" id="hud-sub"></div>
</div>
<div id="tooltip"></div>

<script type="module">
import { Camera } from './core/camera.js';
import { sin, cos, hexRGB, rgba, sqrt, clamp, random, hypot, TAU, PI } from './core/utils.js';
import { drawBackground } from './renderers/galaxy.js';
import { drawCentralStar, drawDocuments, drawCoEntities, drawConnections, drawMiniStar } from './renderers/star-original.js';
// Placement uses the galaxy method (cube-weighted centroid); deterministic hash for jitter.
function hash01(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;}

const canvas = document.getElementById('c');
const camera = new Camera();
let W, H, ctx;

// Camera-fit state. buildStarView records the content bounding box; the camera is
// (re)framed from it both on first load and whenever the viewport size changes —
// see fitCameraToContent(). `userMoved` latches once the viewer pans/zooms so a
// later resize doesn't yank the camera out from under them.
let _fitBox = null, contentLoaded = false, userMoved = false;

// Render resolution. Defaults to the device's devicePixelRatio (crisp). Override
// with ?scale=<n> to render fewer pixels for smoother frames on a weak GPU driving
// a big/high-res display — e.g. ?scale=0.66 on a 4K TV. Imperceptible from across a
// room, but cuts per-frame fill cost proportionally.
const _scaleParam = parseFloat(new URLSearchParams(location.search).get('scale'));
// Clamp to a sane, usable range; fall back to the device pixel ratio for a
// missing/invalid/out-of-range value so a bad ?scale can't break the canvas.
const renderScale = Number.isFinite(_scaleParam) && _scaleParam > 0
  ? Math.min(Math.max(_scaleParam, 0.25), 4)
  : (window.devicePixelRatio || 1);

// Size the canvas backing store — ONCE at startup and on window resize, never per
// frame. Reassigning canvas.width/height reallocates and zeroes the entire pixel
// buffer (~33 MB at 4K) and resets all context state; doing it every frame was the
// main cause of stutter on large/high-res displays. The opaque drawBackground()
// fill already clears each frame, so no per-frame realloc is needed.
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) return;   // iframe not laid out yet — frame() retries next tick
  W = w; H = h;
  canvas.width = Math.round(W * renderScale);
  canvas.height = Math.round(H * renderScale);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  // Re-frame content when the viewport settles to its real size (the iframe is
  // mounted fresh on drill-in and often isn't at full size when this first runs).
  if (contentLoaded && !userMoved) fitCameraToContent();
}
window.addEventListener('resize', resize);
resize();

// Frame the camera on the recorded content bounding box using the CURRENT canvas
// size (W/H). Called on first load and on every re-size until the viewer takes over.
function fitCameraToContent() {
  if (!_fitBox || !W || !H) return;
  const { minX, maxX, minY, maxY } = _fitBox;
  const spanX = maxX - minX + 200;
  const spanY = maxY - minY + 200;
  const fitZoom = Math.min(W / spanX, H / spanY) * 0.8;
  camera.x = (minX + maxX) / 2;
  camera.y = (minY + maxY) / 2;
  camera.zoom = fitZoom;
  camera.targetZoom = fitZoom;
}
let tick = 0;

const params = new URLSearchParams(location.search);
const entityId = params.get('entity') || '';

let centralEntity = null;
const docs = [];
const docIndex = new Map();   // doc.id → doc, for O(1) connection lookups
const coEntities = [];
// Escape graph-derived strings before they reach innerHTML. Titles, entity names and
// collection names are all LLM-extracted from ingested documents, so they are
// user-influenced content, not literals. (Same helper as collection.html.)
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const collections = []; // collections this entity belongs to — periphery ring, gold tint
const pulses = []; // traveling dots along connections
let hoveredId = null;

const API_URL = new URLSearchParams(location.search).get('api') || window.API_URL || 'http://localhost:8100';
const AUTH_TOKEN = new URLSearchParams(location.search).get('token') || '';
const WORKSPACE_ID = new URLSearchParams(location.search).get('workspace') || '';
const fetchHeaders = {};
if (AUTH_TOKEN && AUTH_TOKEN !== 'noop') fetchHeaders['Authorization'] = `Bearer ${AUTH_TOKEN}`;
if (WORKSPACE_ID) fetchHeaders['X-Workspace-Id'] = WORKSPACE_ID;

async function loadData() {
  if (!entityId) {
    document.getElementById('nav-name').textContent = 'no entity specified';
    return;
  }
  try {
    const graph = await fetch(`${API_URL}/entities/${entityId}/star-graph?co_limit=150`, { headers: fetchHeaders }).then(r => r.json());
    buildStarView(graph);
  } catch (err) {
    console.error('Star view: load failed', err);
    document.getElementById('nav-name').textContent = 'load failed';
  }
}
loadData();

// Search glow — cascaded: docs flash → pulses travel → entities flash
window.addEventListener('message', e => {
  if (e.data?.type === 'search_result') {
    const hitDocIds = new Set(e.data.doc_ids || []);
    const hitEntityNames = new Set((e.data.entities || []).map(n => n.toLowerCase()));

    // Find hit docs in our view — preserve search relevance order, cap at 10
    const hitDocsAll = docs.filter(d => hitDocIds.has(d.id));
    // Re-order by search result order (doc_ids comes in score order)
    const docIdOrder = [...hitDocIds];
    hitDocsAll.sort((a, b) => docIdOrder.indexOf(a.id) - docIdOrder.indexOf(b.id));
    const hitDocs = hitDocsAll.slice(0, 10);
    // Find hit co-entities
    const hitCos = coEntities.filter(co => hitEntityNames.has(co.name.toLowerCase()));

    if (!hitDocs.length && !hitCos.length && !hitEntityNames.has(centralEntity?.name?.toLowerCase())) return;

    const shuffledDocs = [...hitDocs].sort(() => random() - 0.5);

    // t=0: Docs flash (staggered, shuffled)
    shuffledDocs.forEach((doc, i) => {
      setTimeout(() => {
        doc.activityGlow = Math.min(1, doc.activityGlow + 0.6);
      }, i * 30 + random() * 40);
    });

    // t=200ms: Small pulses travel from docs → central entity
    setTimeout(() => {
      shuffledDocs.slice(0, 8).forEach((doc, i) => {
        setTimeout(() => {
          pulses.push({
            fromX: doc._px, fromY: doc._py,
            toX: centralEntity.x, toY: centralEntity.y,
            progress: 0,
            speed: 0.007 + random() * 0.005,
            col: [255, 200, 120],
            small: true, // smaller doc→entity pulses
          });
        }, i * 40 + random() * 50);
      });
    }, 200);

    // t=550ms: Central entity flashes on arrival
    setTimeout(() => {
      if (centralEntity) {
        centralEntity.activityGlow = Math.min(1, centralEntity.activityGlow + 0.7);
      }
    }, 550);

    // t=650ms: Pulses radiate from central entity → co-entities (full size)
    setTimeout(() => {
      hitCos.slice(0, 10).forEach((co, i) => {
        setTimeout(() => {
          const tc = { Person:[55,138,221], Organization:[127,119,221], Product:[29,158,117],
            Technology:[186,117,23], Event:[216,90,48] }[co.type] || [156,154,146];
          pulses.push({
            fromX: centralEntity.x, fromY: centralEntity.y,
            toX: co._px, toY: co._py,
            progress: 0,
            speed: 0.005 + random() * 0.004,
            col: tc,
            small: false,
          });
        }, i * 60 + random() * 40);
      });
    }, 650);

    // t=1000ms: Co-entities flash on arrival
    setTimeout(() => {
      hitCos.forEach((co, i) => {
        setTimeout(() => {
          co.activityGlow = Math.min(1, co.activityGlow + 0.6);
        }, i * 40);
      });
    }, 1000);
  }
});

function buildStarView(graph) {
  const { entity: ent, documents: docList, co_entities: coList, collections: collectionList = [],
          total_documents: totalDocs = docList.length } = graph;
  const cx = 2500, cy = 2500;

  centralEntity = {
    id: ent.id,
    name: ent.canonical_name,
    type: ent.type,
    sourceCount: ent.source_count,
    radius: 30,
    x: cx, y: cy,
    activityGlow: 0,
  };

  // Doc ID → doc object (for linking co-entities to docs)
  const docById = {};

  // THE GALAXY METHOD (state.js _makeEntityNode): co-entities are fixed CONTAINERS at
  // their real galaxy positions; a doc is the cube-weighted CENTROID of its co-entities'
  // positions + jitter. No force sim, no tuning — the doc falls to the gravitational
  // balance of the co-entities it connects to, exactly like an entity falls to its
  // domains' centroid on the galaxy map.
  const RIM = 900;
  const coAll = (graph.co_entities || []).filter(c => c.type !== 'Domain');
  // Fix each co-entity on the rim at its BEARING from the core's galaxy position, so its
  // direction preserves where it sits on the galaxy map (galaxy layout isn't even — it's
  // the domain UMAP). Co-entities with no galaxy position fall back to an even spread.
  const cgx = graph.entity?.gx ?? 0.5, cgy = graph.entity?.gy ?? 0.5;
  // 1) Raw galaxy bearing per co-entity (the direction it lies from the core on the map).
  const rawBearing = coAll.map((c, i) => ({
    id: c.id,
    a: (c.gx != null && c.gy != null && (c.gx !== cgx || c.gy !== cgy))
      ? Math.atan2(c.gy - cgy, c.gx - cgx)
      : (-Math.PI / 2 + (i / Math.max(1, coAll.length)) * TAU),
  }));
  // 2) Blended angular spread. openai's co-entities nearly all lie in ONE galaxy direction
  // (AI/software), so honoring raw degrees leaves half the disk empty; but pure rank
  // equalization evens out the density and loses the signal that that region is crowded.
  // So blend each co-entity's UNIFORM rank position with its NORMALIZED raw galaxy bearing
  // (BLEND = equalized share), keeping order intact, then renormalize the blend to span the
  // FULL circle. Result: all 360deg is used AND spacing stays data-driven — co-entities
  // bunch where their galaxy region is genuinely dense, with gaps where it is sparse.
  const BLEND = 0.6;                                     // 0.6 uniform + 0.4 raw galaxy density
  const ordered = [...rawBearing].sort((u, v) => u.a - v.a);
  const N = ordered.length || 1;
  const rawMin = ordered[0]?.a ?? 0, rawMax = ordered[N - 1]?.a ?? 1;
  const rawRange = (rawMax - rawMin) || 1;
  const pos = ordered.map((p, i) => BLEND * ((i + 0.5) / N) + (1 - BLEND) * ((p.a - rawMin) / rawRange));
  const pMin = pos[0] ?? 0, pMax = pos[N - 1] ?? 1, pRange = (pMax - pMin) || 1;
  const coPos = new Map();
  ordered.forEach((p, i) => {
    const t = (pos[i] - pMin) / pRange;                 // 0..1 across the full circle
    const a = -Math.PI + t * TAU;
    coPos.set(p.id, { angle: a, x: cx + Math.cos(a) * RIM, y: cy + Math.sin(a) * RIM });
  });
  const docCo = new Map();                              // docId -> [{id, w}]
  for (const c of coAll) for (const did of (c.shared_doc_ids || [])) {
    if (!docCo.has(did)) docCo.set(did, []); docCo.get(did).push({ id: c.id, w: c.weight || 1 });
  }
  // POLAR placement — the center now ENCODES something:
  //   radius = the doc's relevance to the CORE entity (how much this doc is "about" it),
  //   angle  = the gravitational bearing toward the co-entities it shares.
  //
  // radius: rel = 1/n_entities (a doc where the core is one of few entities is more about
  // the core than one where it's 1-of-1272), normalized by the FARTHEST doc so only the
  // least-relevant reaches the rim and equally-relevant docs share a radius (then jittered).
  // This is resolveDocs' 'value' mode — reused, not re-invented.
  const RIN = 90, ROUT = 820;                          // inner floor .. rim for docs
  const rels = (graph.documents || []).map(d => 1 / (d.n_entities || 1));
  const relMax = rels.length ? Math.max(...rels) : 1;
  const relMin = rels.length ? Math.min(...rels) : 0;
  const relRange = (relMax - relMin) || 1;
  // angle: equal-weight resultant bearing of the co-entities the doc shares (each shared
  // co-entity is one honest tie; shared_doc_ids is membership, not per-doc strength). We
  // do NOT cube — co-entity weights are GLOBAL co-occurrence counts spanning ~40x, and
  // cubing lets one globally-popular co-entity own the pull against the doc's own mentions.
  for (const d of (graph.documents || [])) {
    const cs = docCo.get(d.id) || [];
    let sx = 0, sy = 0, tw = 0;
    for (const { id } of cs) { const p = coPos.get(id); if (!p) continue; sx += p.x - cx; sy += p.y - cy; tw += 1; }
    const ang = tw > 0 ? Math.atan2(sy, sx) : hash01(d.id) * TAU;   // co-entity bearing, else random
    const rel = 1 / (d.n_entities || 1);
    const rTarget = RIN + (ROUT - RIN) * (relMax - rel) / relRange; // least-relevant -> rim
    // jitter: angular spread so ties fan out, small radial wobble so equal-radius docs
    // don't form a hard ring. The core-relevance radius is preserved (band, not pin).
    const aj = ang + (hash01(d.id + 'a') - 0.5) * 0.55;
    const rj = Math.max(RIN * 0.5, rTarget + (hash01(d.id + 'r') - 0.5) * 80);
    const jx = cx + Math.cos(aj) * rj, jy = cy + Math.sin(aj) * rj;
    const doc = {
      id: d.id, kind: 'document', title: d.title || 'Untitled', content_type: d.content_type || 'text',
      radius: 8, x: jx, y: jy, _px: jx, _py: jy, angle: Math.atan2(jy - cy, jx - cx),
      orbitPhase: random() * TAU, orbitSpeed: 0.5 + random() * 0.5, orbitDrift: 4 + random() * 6, activityGlow: 0,
    };
    docs.push(doc); docById[d.id] = doc; docIndex.set(d.id, doc);
  }

  // Place co-entities — filter out Domain types, position near their shared docs
  const filteredCo = coList.filter(c => c.type !== 'Domain');
  const maxWeight = Math.max(1, ...filteredCo.map(c => c.weight));
  const sortedCo = [...filteredCo].sort((a, b) => b.weight - a.weight);
  const labelThreshold = sortedCo.length > 8
    ? sortedCo[Math.floor(sortedCo.length * 0.3)]?.weight || 1
    : 0;

  for (let i = 0; i < sortedCo.length; i++) {
    const co = sortedCo[i];
    // Same rim position the docs were pulled toward — its BEARING from the core's galaxy
    // position, so a co-entity sits where it is on the galaxy map (+ tiny ring thickness).
    const p0 = coPos.get(co.id);
    const baseAngle = p0 ? p0.angle : (i * 2.399963);
    // Galaxy bearing is the ANCHOR (a co-entity sits in the direction it lies from the
    // core on the galaxy map), but we fan + jitter around it so same-bearing co-entities
    // form a readable CLOUD at the edge instead of piling into one thin arc. Angular
    // jitter spreads them across their true direction; radial jitter gives depth.
    const angle = baseAngle + (hash01(co.id + 'ca') - 0.5) * 0.42;
    const r = RIM + 30 + hash01(co.id + 'cr') * 230;

    coEntities.push({
      id: co.id,
      kind: 'co_entity',
      name: co.canonical_name,
      type: co.type,
      weight: co.weight,
      sharedDocIds: co.shared_doc_ids || [],
      labelThreshold,
      radius: 5 + sqrt(co.weight) * 2,
      x: cx + cos(angle) * r,
      y: cy + sin(angle) * r,
      _px: cx + cos(angle) * r,
      _py: cy + sin(angle) * r,
      orbitPhase: random() * TAU,
      orbitSpeed: 0.4 + random() * 0.6,
      orbitDrift: 5 + random() * 8,
      activityGlow: 0,
    });
  }

  // Repo nodes — outer periphery ring (beyond co-entities), gold tint, so this
  // reads as "the collection(s) this entity belongs to". Click navigates to collection.html.
  const repoRing = 1080; // collections beyond the co-entities
  for (let i = 0; i < collectionList.length; i++) {
    const rp = collectionList[i];
    const rAngle = (i / Math.max(collectionList.length, 1)) * TAU - PI / 2;
    const rx = cx + cos(rAngle) * repoRing;
    const ry = cy + sin(rAngle) * repoRing;

    collections.push({
      id: `repo:${rp.id}`,
      kind: 'collection',
      collectionId: rp.id,
      collectionName: rp.name,
      name: `▣ ${rp.name}`,
      type: 'Repo',
      weight: 1,
      labelThreshold: 0,
      sharedDocIds: [],
      radius: 9,
      x: rx, y: ry,
      _px: rx, _py: ry,
      orbitPhase: random() * TAU,
      orbitSpeed: 0.3 + random() * 0.3,
      orbitDrift: 5 + random() * 6,
      activityGlow: 0,
    });
  }

  // Fit camera to show all nodes
  let minX = cx - 50, maxX = cx + 50, minY = cy - 50, maxY = cy + 50;
  for (const d of docs) { minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x); minY = Math.min(minY, d.y); maxY = Math.max(maxY, d.y); }
  for (const e of coEntities) { minX = Math.min(minX, e.x); maxX = Math.max(maxX, e.x); minY = Math.min(minY, e.y); maxY = Math.max(maxY, e.y); }
  for (const rp of collections) { minX = Math.min(minX, rp.x); maxX = Math.max(maxX, rp.x); minY = Math.min(minY, rp.y); maxY = Math.max(maxY, rp.y); }
  // Record the content box and frame the camera on it (via the current canvas
  // size). Kept in sync by resize() so a fresh-mounted iframe that reaches full
  // size after this runs still ends up correctly framed rather than parked in a
  // stale-sized corner.
  _fitBox = { minX, maxX, minY, maxY };
  contentLoaded = true;
  fitCameraToContent();

  document.getElementById('nav-name').textContent = ent.canonical_name;
  document.getElementById('hud-info').textContent =
    `${ent.type} · ${docList.length}${totalDocs > docList.length ? ' of ' + totalDocs : ''} docs · ${sortedCo.length} co-entities` +
    (collections.length ? ` · ${collections.length} collections` : '');
  document.getElementById('hud-sub').textContent = `${ent.source_count} source mentions`;
  console.log(`Star loaded: ${docList.length} docs, ${sortedCo.length} co-entities`);
}

// Hit test
function hitTest(wx, wy) {
  for (const d of docs) {
    if (hypot(wx - d._px, wy - d._py) < d.radius * 1.5 + 5) return d;
  }
  for (const e of coEntities) {
    if (hypot(wx - e._px, wy - e._py) < e.radius * 1.2 + 5) return e;
  }
  for (const rp of collections) {
    if (hypot(wx - rp._px, wy - rp._py) < rp.radius * 1.3 + 5) return rp;
  }
  if (centralEntity && hypot(wx - centralEntity.x, wy - centralEntity.y) < centralEntity.radius * 2) {
    return { ...centralEntity, kind: 'central' };
  }
  return null;
}

// Input
canvas.addEventListener('mousedown', e => camera.handleMouseDown(e));
canvas.addEventListener('mousemove', e => {
  if (camera.handleMouseDrag(e)) { userMoved = true; return; }
  W = canvas.width / renderScale;
  H = canvas.height / renderScale;
  const w = camera.screenToWorld(e.clientX, e.clientY, W, H);
  const hit = hitTest(w.x, w.y);

  hoveredId = hit ? hit.id : null;
  canvas.style.cursor = hit ? 'pointer' : 'grab';

  const tt = document.getElementById('tooltip');
  if (hit && hit.kind === 'document') {
    // Find co-entities that share this doc
    const sharedEnts = coEntities.filter(co => co.sharedDocIds.includes(hit.id));
    const sharedList = sharedEnts.slice(0, 5).map(e => e.name).join(', ');
    tt.style.display = 'block';
    tt.style.left = Math.min(e.clientX + 14, W - 350) + 'px';
    tt.style.top = Math.min(e.clientY - 8, H - 120) + 'px';
    tt.innerHTML = `<div class="tt-title">${esc(hit.title)}</div>
      ${sharedEnts.length > 0 ? `<div>also mentions: ${esc(sharedList)}${sharedEnts.length > 5 ? '…' : ''}</div>` : ''}
      <div class="tt-dim">click to open document</div>`;
  } else if (hit && hit.kind === 'co_entity') {
    const sharedDocNames = hit.sharedDocIds
      .map(id => docs.find(d => d.id === id)?.title)
      .filter(Boolean).slice(0, 3);
    tt.style.display = 'block';
    tt.style.left = Math.min(e.clientX + 14, W - 350) + 'px';
    tt.style.top = Math.min(e.clientY - 8, H - 120) + 'px';
    tt.innerHTML = `<div class="tt-title">${esc(hit.name)}</div>
      <div>${esc(hit.type)} · ${hit.weight} co-occurrences</div>
      ${sharedDocNames.length > 0 ? `<div>shared docs: ${esc(sharedDocNames.join(', '))}${hit.sharedDocIds.length > 3 ? '…' : ''}</div>` : ''}
      <div class="tt-dim">click to re-center on this entity</div>`;
  } else if (hit && hit.kind === 'collection') {
    tt.style.display = 'block';
    tt.style.left = Math.min(e.clientX + 14, W - 350) + 'px';
    tt.style.top = Math.min(e.clientY - 8, H - 120) + 'px';
    tt.innerHTML = `<div class="tt-title">▣ ${esc(hit.collectionName)} · collection</div>
      <div class="tt-dim">click to open collection view</div>`;
  } else if (hit && hit.kind === 'central') {
    tt.style.display = 'block';
    tt.style.left = Math.min(e.clientX + 14, W - 350) + 'px';
    tt.style.top = Math.min(e.clientY - 8, H - 80) + 'px';
    tt.innerHTML = `<div class="tt-title">${esc(hit.name)}</div>
      <div>${esc(hit.type)} · ${hit.sourceCount} docs</div>`;
  } else {
    tt.style.display = 'none';
  }
});

canvas.addEventListener('mouseup', e => {
  const wasDrag = camera.didDrag;
  camera.handleMouseUp();
  if (!wasDrag) {
    W = canvas.width / renderScale;
    H = canvas.height / renderScale;
    const w = camera.screenToWorld(e.clientX, e.clientY, W, H);
    const hit = hitTest(w.x, w.y);
    if (hit) {
      if (hit.kind === 'co_entity') {
        const params = new URLSearchParams(location.search);
        params.set('entity', hit.id);
        window.location.search = params.toString();
      } else if (hit.kind === 'document') {
        window.parent.postMessage({
          type: 'node_selected', nodeType: 'document',
          data: { id: hit.id, title: hit.title, content_type: hit.content_type || 'text' }
        }, '*');
      } else if (hit.kind === 'collection') {
        // Jump to that collection's structure view (host swaps star.html -> collection.html)
        window.parent.postMessage({ type: 'enter_collection',
                                   collectionId: hit.collectionId,
                                   collectionName: hit.collectionName }, '*');
      } else if (hit.kind === 'central') {
        window.parent.postMessage({
          type: 'node_selected', nodeType: 'entity',
          data: {
            id: centralEntity.id,
            name: centralEntity.name,
            entityType: centralEntity.type,
            source_count: centralEntity.sourceCount,
          }
        }, '*');
      }
    } else {
      // Clicked empty space — close any open panel
      window.parent.postMessage({ type: 'node_cleared' }, '*');
    }
  }
});

canvas.addEventListener('wheel', e => { userMoved = true; camera.handleWheel(e); }, { passive: false });

// Double-click empty space → zoom in toward cursor (Google Maps style)
canvas.addEventListener('dblclick', e => {
  W = canvas.width / renderScale;
  H = canvas.height / renderScale;
  const w = camera.screenToWorld(e.clientX, e.clientY, W, H);
  const hit = hitTest(w.x, w.y);
  if (!hit) {
    userMoved = true;
    camera.flyTo(w.x, w.y, camera.zoom * 1.8, 400);
  }
});

// Render loop
function frame() {
  // Self-correct the canvas size: the iframe is mounted fresh on drill-in and may
  // not be at its final size when the module first ran resize(). Re-size only when
  // the viewport actually changed (cheap check; avoids the per-frame realloc that
  // #23 removed). Until the viewport has a real size, ctx is undefined — skip drawing.
  if (!ctx || W !== window.innerWidth || H !== window.innerHeight) resize();
  if (!ctx) { requestAnimationFrame(frame); return; }

  tick++;
  camera.update();

  if (centralEntity && centralEntity.activityGlow > 0) {
    centralEntity.activityGlow = Math.max(0, centralEntity.activityGlow - 0.0025 * 16.67);
  }
  for (const e of coEntities) {
    if (e.activityGlow > 0) e.activityGlow = Math.max(0, e.activityGlow - 0.0025 * 16.67);
  }
  for (const d of docs) {
    if (d.activityGlow > 0) d.activityGlow = Math.max(0, d.activityGlow - 0.0025 * 16.67);
  }
  for (const rp of collections) {
    if (rp.activityGlow > 0) rp.activityGlow = Math.max(0, rp.activityGlow - 0.0025 * 16.67);
  }

  // Update pulses
  for (let i = pulses.length - 1; i >= 0; i--) {
    pulses[i].progress += pulses[i].speed;
    if (pulses[i].progress >= 1) pulses.splice(i, 1);
  }

  drawBackground(ctx, W, H, tick);

  ctx.save();
  camera.applyTransform(ctx, W, H);

  if (centralEntity) {
    // Visible world box (+ margin) — off-screen nodes/lines are skipped by the
    // renderers, the big win once a star has many documents.
    const _m = 200 / camera.zoom;
    const view = {
      left: camera.x - W / 2 / camera.zoom - _m,
      right: camera.x + W / 2 / camera.zoom + _m,
      top: camera.y - H / 2 / camera.zoom - _m,
      bottom: camera.y + H / 2 / camera.zoom + _m,
    };

    drawConnections(ctx, centralEntity.x, centralEntity.y, docs, coEntities, hoveredId, centralEntity.id, docIndex, view);

    // Center → repo peripheral connections (gold), distinguishing "belongs to repo"
    for (const rp of collections) {
      const litR = hoveredId === centralEntity.id || hoveredId === rp.id;
      ctx.strokeStyle = `rgba(224,160,48,${litR ? 0.35 : 0.06})`;
      ctx.lineWidth = litR ? 1.6 : 0.5;
      ctx.setLineDash([3, 9]);
      ctx.beginPath();
      ctx.moveTo(centralEntity.x, centralEntity.y);
      ctx.lineTo(rp._px, rp._py);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Draw traveling pulses
    for (const p of pulses) {
      const rawP = p.progress;
      const ep = rawP < 0.5 ? 2 * rawP * rawP : -1 + (4 - 2 * rawP) * rawP;
      const gf = sin(rawP * Math.PI);
      const px = p.fromX + (p.toX - p.fromX) * ep;
      const py = p.fromY + (p.toY - p.fromY) * ep;
      const bright = p.small ? 0.65 : 1.3;
      const scale = p.small ? 0.7 : 1.0;

      // Trail
      const tp = Math.max(0, rawP - 0.10);
      const tep = tp < 0.5 ? 2 * tp * tp : -1 + (4 - 2 * tp) * tp;
      const tx = p.fromX + (p.toX - p.fromX) * tep;
      const ty = p.fromY + (p.toY - p.fromY) * tep;
      const tg = ctx.createLinearGradient(tx, ty, px, py);
      tg.addColorStop(0, `rgba(${p.col[0]},${p.col[1]},${p.col[2]},0)`);
      tg.addColorStop(1, `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${0.30 * gf * bright})`);
      ctx.strokeStyle = tg;
      ctx.lineWidth = 1.2 * scale;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(px, py);
      ctx.stroke();

      // Dot
      const sz = (3 + gf * 2.5) * scale;
      const dg = ctx.createRadialGradient(px, py, 0, px, py, sz);
      dg.addColorStop(0, `rgba(255,255,255,${0.85 * gf * bright})`);
      dg.addColorStop(0.3, `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${0.6 * gf * bright})`);
      dg.addColorStop(1, `rgba(${p.col[0]},${p.col[1]},${p.col[2]},0)`);
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.arc(px, py, sz, 0, TAU);
      ctx.fill();
    }

    drawDocuments(ctx, docs, tick, hoveredId, view);
    drawCoEntities(ctx, coEntities, tick, hoveredId, view);
    // Repo nodes render as small glowing gold stars — brighter/sharper than
    // a co-entity dot, but smaller and dimmer than the central entity star.
    for (const rp of collections) {
      if (rp.x < view.left || rp.x > view.right || rp.y < view.top || rp.y > view.bottom) continue;
      drawMiniStar(ctx, rp, tick, hoveredId, { color: '#e0a030', brightness: 0.55 });
    }
    drawCentralStar(ctx, centralEntity, tick);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

// Report real user input to the shell so idle detection works while the star view
// is up. Throttled; background/API work never triggers it.
let _lastActivityPing = 0;
function notifyActivity() {
  const now = performance.now();
  if (now - _lastActivityPing < 400) return;
  _lastActivityPing = now;
  try { window.parent.postMessage({ type: 'user_activity' }, '*'); } catch (_) {}
}
['mousedown', 'mousemove', 'wheel', 'keydown', 'touchstart'].forEach(
  ev => window.addEventListener(ev, notifyActivity, { passive: true })
);
</script>
</body>
</html>
