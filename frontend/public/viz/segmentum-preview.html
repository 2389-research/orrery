<meta charset="utf-8">
<title>Segmentum placement preview</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;color:#c0c8e0;font:12px 'Courier New',monospace;overflow:hidden}
  canvas{display:block}
  #hud{position:fixed;top:10px;left:12px;z-index:2;line-height:1.6;color:#8aa0c8}
  #hud b{color:#cfe0ff}
</style>
<div id="hud">loading…</div>
<canvas id="c"></canvas>
<script type="module">
// Standalone PREVIEW of the segmentum pipeline's PLACEMENT (Stages 0-2). Does not touch
// the live star page. Draws docs as points: radius = relevance band, angle = domain
// anchor pull + connectivity. Domain anchor rays + labels shown so you can read structure.
import { layoutSegmentum, cellAngle, cellRadius, R0, R1, MISC_COLOR } from './core/segmentum-layout.js';

const q = new URLSearchParams(location.search);
const entityId = q.get('entity') || '';
const API = q.get('api') || 'http://localhost:8100';
const WS = q.get('workspace') || '';
const headers = {}; if (WS) headers['X-Workspace-Id'] = WS;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function size(){ cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
size(); addEventListener('resize', ()=>{ size(); if(window.__P) draw(window.__P); });

// sector colour: mid-path hex if present in palette, else first present leaf under it.
function sectorColor(mid, palette){
  if (mid === 'misc') return MISC_COLOR;
  if (palette[mid]) return palette[mid];
  const leaves = Object.keys(palette).filter(p=>p.startsWith(mid+'/')).sort();
  return leaves.length ? palette[leaves[0]] : MISC_COLOR;
}

const A2 = a => `${(a[0]*255|0).toString(16).padStart(2,'0')}`; // unused helper guard
function hex(c){ return c; }

function draw(P){
  const { seg, palette, entity } = P;
  const W = innerWidth, H = innerHeight, cx = W/2, cy = H/2;
  const scale = Math.min(W,H)/2 / (R1+70) * 0.92;
  ctx.clearRect(0,0,W,H);

  // faint radius guides
  ctx.strokeStyle='rgba(120,150,200,.08)'; ctx.lineWidth=1;
  for (const r of [R0, R0+(R1-R0)*0.33, R0+(R1-R0)*0.66, R1]){ ctx.beginPath(); ctx.arc(cx,cy,r*scale,0,Math.PI*2); ctx.stroke(); }

  const pathCell = (i,j) => {
    const {A,J}=seg; const dA=(Math.PI*2)/A/2;
    const th=cellAngle(i,A), r0c=(R0+j/J*(R1-R0))*scale, r1c=(R0+(j+1)/J*(R1-R0))*scale;
    ctx.beginPath();
    ctx.arc(cx,cy,r1c, th-dA, th+dA);
    ctx.arc(cx,cy,r0c, th+dA, th-dA, true);
    ctx.closePath();
  };

  if (seg.mode==='territories'){
    const {A,J,cells,loops,guard}=seg;
    // 1. filled occupied cells (drawable domains), coloured by domain
    for(let i=0;i<A;i++)for(let j=0;j<J;j++){
      const c=cells[i][j]; if(!c) continue;
      const g=guard[c.domain]; if(g && !g.drawable) continue;      // suppressed confetti: no fill
      const col=sectorColor(c.domain,palette);
      pathCell(i,j); ctx.fillStyle=col+(c.contested?'12':'2e'); ctx.fill();
    }
    // 2. boundary loops (drawable domains), stroked in domain colour
    for(const [dom,ll] of Object.entries(loops)){
      const g=guard[dom]; if(g && !g.drawable) continue;
      const col=sectorColor(dom,palette);
      ctx.strokeStyle=col+'cc'; ctx.lineWidth=1.4;
      for(const L of ll){
        ctx.beginPath();
        L.forEach((v,k)=>{ const r=(R0+v.j/J*(R1-R0))*scale, th=-Math.PI+ (((v.i%A)+A)%A)/A*Math.PI*2;
          const x=cx+Math.cos(th)*r, y=cy+Math.sin(th)*r; k?ctx.lineTo(x,y):ctx.moveTo(x,y); });
        ctx.stroke();
      }
    }
    // 3. labels at each drawable domain's largest component
    ctx.textAlign='center'; ctx.font="12px 'Courier New',monospace";
    for(const [dom,comps] of Object.entries(seg.cells?[]:[])){} // noop guard
    const compsBy={};
    for(let i=0;i<A;i++)for(let j=0;j<J;j++){ const c=cells[i][j]; if(!c)continue; (compsBy[c.domain]=compsBy[c.domain]||[]).push([i,j]); }
    for(const [dom,cellsOf] of Object.entries(compsBy)){
      const g=guard[dom]; if(g && !g.drawable) continue;
      // centroid of the domain's cells
      let si=0,sj=0; for(const [i,j] of cellsOf){ si+=(((i%A)+A)%A); sj+=j; }
      const mi=si/cellsOf.length, mj=sj/cellsOf.length;
      const r=(R0+(mj+1)/J*(R1-R0)+18)*scale, th=-Math.PI+mi/A*Math.PI*2;
      const col=sectorColor(dom,palette);
      ctx.fillStyle=col+'e0'; ctx.fillText(dom.split('/').pop(), cx+Math.cos(th)*r, cy+Math.sin(th)*r);
    }
  }

  // documents as faint points on top so you can see the underlying placement
  for (const p of seg.points){
    const g=seg.guard?.[p.domain];
    const col = sectorColor(p.domain, palette);
    const x=cx+Math.cos(p.theta)*p.r*scale, y=cy+Math.sin(p.theta)*p.r*scale;
    ctx.beginPath(); ctx.arc(x,y,1.7,0,Math.PI*2); ctx.fillStyle=col+(g&&!g.drawable?'66':'aa'); ctx.fill();
  }

  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();

  const nDraw = seg.guard ? Object.values(seg.guard).filter(g=>g.drawable).length : 0;
  const nSup  = seg.guard ? Object.values(seg.guard).filter(g=>!g.drawable).length : 0;
  document.getElementById('hud').innerHTML =
    `<b>${entity}</b> — segmentum view (Stages 0–5)<br>`+
    `${seg.points.length} docs · ${nDraw} drawable territories`+(nSup?` · ${nSup} suppressed (confetti)`:'')+`<br>`+
    `<span style="color:#667">radius = relevance · angle = domain-anchor + connectivity · sectors = cell occupancy → edge-cancellation borders</span>`;
}

(async ()=>{
  try{
    const graph = await fetch(`${API}/entities/${entityId}/star-graph?co_limit=150`, {headers}).then(r=>r.json());
    const seg = layoutSegmentum(graph, { maxTicks: 260 });
    window.__P = { seg, palette: graph.palette||{}, entity: graph.entity?.canonical_name || entityId };
    const nDraw = seg.guard ? Object.values(seg.guard).filter(g=>g.drawable).length : 0;
    console.log(`Preview loaded: ${seg.points.length} docs, mode=${seg.mode}, ${nDraw} drawable territories`);
    draw(window.__P);
  }catch(e){ document.getElementById('hud').textContent = 'error: '+e.message; console.error(e); }
})();
</script>
